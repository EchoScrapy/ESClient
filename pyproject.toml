[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ESCaptcha"
version = "0.1.0"
description = "Python client for EchoSolutions CAPTCHA solver services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ESCaptcha"]
